apiVersion: karpenter.edgecenter.ru/v1alpha1
kind: EdgeCenterNodeClass
metadata:
  name: example-baremetal
spec:
  clusterID: example-cluster
  projectID: 12345
  regionID: 10
  region: example-region
  networkID: REPLACE_NETWORK_UUID
  imageID: REPLACE_BAREMETAL_TALOS_IMAGE_UUID
  flavors:
  - name: bm1-hf-medium
    cpu: 16
    memoryGiB: 64
    price: 1
  bootSizeGiB: 447 # Usable capacity estimate of the physical boot disk.
  bareMetalStorage:
    ephemeralSizeGiB: 64 # Talos /var; use 128 here for a larger system partition.
    localVolumeName: local-data # Remaining space mounted at /var/mnt/local-data.
    # dataDiskVolumeName: local-data2 # Optional: whole second disk at /var/mnt/local-data2.
  addresses:
    cidr: 10.64.0.0/18
    hostOffset: 266
    start: 18
    end: 18
    kubeSpanPortBase: 52110
  gateways:
  - publicIP: 192.0.2.10
  - publicIP: 192.0.2.11
  credentials:
    name: edgecenter-api
  talos:
    name: talos-worker
  bootstrapMode: UserData
  talosEndpoints:
  - 192.0.2.20:50000
  computeType: BareMetal
